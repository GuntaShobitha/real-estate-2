<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Registration | STACKLY International Realty</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.08) 0%, rgba(7, 9, 14, 1) 80%);">

  <header style="padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,0.06);">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="nav-logo">
        <img src="./images/logo-dark.webp" alt="STACKLY Logo" class="nav-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <div class="nav-logo-fallback" style="display: none;">
          <div class="logo-crest">S</div>
          <div class="logo-text">STACK<span>LY</span></div>
        </div>
      </a>
      <a href="login.html" class="btn btn-outline-gold btn-sm">
        <span class="material-symbols-outlined" style="font-size: 1.1rem; margin-right: 4px;">login</span>
        Sign In Instead
      </a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px;">
    <div style="width: 100%; max-width: 520px; background: rgba(13,17,26,0.9); border: 1px solid var(--gold-border); border-radius: var(--radius-xl); padding: 40px 36px; box-shadow: var(--shadow-luxury); backdrop-filter: blur(20px);">
      <div class="text-center" style="margin-bottom: 24px;">
        <span class="section-tag" style="margin-bottom: 12px;">New Client Portal</span>
        <h1 style="font-family: var(--font-serif); font-size: 1.9rem; font-weight: 700; margin-bottom: 8px;">Create Private Account</h1>
        <p style="color: var(--text-secondary); font-size: 0.88rem;">Join over 14,000 verified high-net-worth estate collectors.</p>
      </div>

      <form id="stacklyRegisterForm">
        <div class="form-input-box" style="margin-bottom: 18px;">
          <label class="form-input-label">1. Account Designation</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;">
            <button type="button" class="role-select-btn active" data-role="user">
              <span class="material-symbols-outlined" style="font-size: 1.1rem;">person</span> Private Buyer
            </button>
            <button type="button" class="role-select-btn" data-role="admin">
              <span class="material-symbols-outlined" style="font-size: 1.1rem;">admin_panel_settings</span> Admin Desk
            </button>
          </div>
          <input type="hidden" id="selectedRole" value="user" />
        </div>

        <div class="form-input-box">
          <label class="form-input-label">2. Full Legal Name</label>
          <input type="text" id="regName" class="form-control" placeholder="e.g. Harrison Sterling" />
          <div class="form-error-msg" id="regNameError"></div>
        </div>

        <div class="form-input-box">
          <label class="form-input-label">3. Encrypted Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="client@privateoffice.com" />
          <div class="form-error-msg" id="regEmailError"></div>
        </div>

        <div class="form-input-box">
          <label class="form-input-label">4. Create Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••••••" />
          <div class="form-error-msg" id="regPasswordError"></div>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 14px; margin-bottom: 16px;">
          Complete Registration
        </button>

        <div class="text-center">
          <span style="color: var(--text-muted); font-size: 0.85rem;">Already registered? </span>
          <a href="login.html" style="color: var(--gold-light); font-size: 0.85rem; font-weight: 600;">Sign in to your portal</a>
        </div>
      </form>
    </div>
  </main>

  <footer style="padding: 20px 0; text-align: center; color: var(--text-muted); font-size: 0.82rem; border-top: 1px solid rgba(255,255,255,0.06);">
    &copy; 2026 STACKLY International Realty Ltd. All rights reserved.
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
